name: Validate and deploy course catalogue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-catalog-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # This repository currently has no committed npm/yarn lockfile.
      # Keep setup-node caching disabled until a lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime diagnostics
        run: |
          node --version
          npm --version

      - name: Validate course content
        run: npm run validate:content

      - name: Build Docusaurus
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm exec docusaurus build 2>&1 | tee docusaurus-build.log
          build_status=${PIPESTATUS[0]}

          server_bundle=$(find .docusaurus -type f -name 'server.bundle.js' -print -quit 2>/dev/null || true)
          if [[ -n "$server_bundle" ]]; then
            cp "$server_bundle" server.bundle.js
            grep -n -C 2 'resolveWeak' "$server_bundle" > server-bundle-resolveweak-context.txt || true
          fi

          exit "$build_status"

      - name: Enforce centrally hosted Academy shell on every published HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          script = f'<script defer src="{loader}" {marker}></script>'
          pages = sorted(Path('build').rglob('*.html'))
          if not pages:
              raise SystemExit('No published HTML pages found in build')

          old_shell = re.compile(
              r'<script\b[^>]*(?:academy-navigation(?:-loader)?\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>',
              re.IGNORECASE | re.DOTALL,
          )

          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              html = old_shell.sub('', html)
              if not re.search(r'</head\s*>', html, re.I):
                  raise SystemExit(f'Cannot inject Academy shell loader into {path}')
              html = re.sub(r'</head\s*>', f'  {script}\n</head>', html, count=1, flags=re.I)
              path.write_text(html, encoding='utf-8')

          failures = []
          duplicates = []
          for path in pages:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if html.count(loader) != 1 or html.count(marker) != 1:
                  failures.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicates.append(str(path))
          if failures:
              raise SystemExit('Canonical Academy shell verification failed for: ' + ', '.join(failures))
          if duplicates:
              raise SystemExit('Duplicate Academy shell loaders found in: ' + ', '.join(duplicates))

          print(f'Canonical Academy v10 shell loader verified on {len(pages)} published HTML page(s).')
          PY

      - name: Verify global-shell-only chrome
        run: |
          test -f build/index.html
          grep -q 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1' build/index.html
          grep -q 'data-skunkworks-global-nav="v10"' build/index.html
          if grep -q 'navbar__inner\|navbar__brand\|footer__links\|footer__bottom' build/index.html; then
            echo 'Native Docusaurus navbar/footer markup must not be rendered on the Course Catalog landing page.'
            exit 1
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build-diagnostics-${{ github.run_id }}
          path: |
            docusaurus-build.log
            server.bundle.js
            server-bundle-resolveweak-context.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-production:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Course Catalog production and canonical Academy shell source
        run: |
          loader_url='https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          ui_url='https://skunkworksacademy.com/assets/skunkworks-ui.js?v=2026.08.15.1'
          footer_url='https://skunkworksacademy.com/assets/skunkworks-footer.js?v=2026.08.15.1'
          css_url='https://skunkworksacademy.com/assets/skunkworks-design-system.css?v=2026.08.15.1'

          for attempt in {1..30}; do
            home="$(curl --location --fail --silent --show-error --max-time 20 https://catalog.skunkworksacademy.com/ || true)"
            loader="$(curl --location --fail --silent --show-error --max-time 20 "$loader_url" || true)"
            ui="$(curl --location --fail --silent --show-error --max-time 20 "$ui_url" || true)"
            footer="$(curl --location --fail --silent --show-error --max-time 20 "$footer_url" || true)"
            css="$(curl --location --fail --silent --show-error --max-time 20 "$css_url" || true)"

            if printf '%s' "$home" | grep -q 'academy-navigation.js?v=2026.08.15.1' \
              && printf '%s' "$home" | grep -q 'data-skunkworks-global-nav="v10"' \
              && ! printf '%s' "$home" | grep -Eq 'navbar__inner|navbar__brand|footer__links|footer__bottom' \
              && printf '%s' "$loader" | grep -q 'skunkworks-ui.js' \
              && printf '%s' "$loader" | grep -q 'skunkworks-footer.js' \
              && printf '%s' "$loader" | grep -q 'skunkworks-design-system.css' \
              && printf '%s' "$ui" | grep -q 'Skunkworks Academy Global UI' \
              && printf '%s' "$footer" | grep -q 'Skunkworks Academy Global Footer' \
              && printf '%s' "$css" | grep -q 'Skunkworks Academy Global Design System'; then
              echo 'Course Catalog production verification succeeded with canonical Academy UI, footer and design system.'
              exit 0
            fi
            sleep 10
          done
          echo 'Course Catalog production verification failed.'
          exit 1
