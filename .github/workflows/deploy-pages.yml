name: Validate and deploy course catalogue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: course-catalog-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      # Do not enable setup-node's npm cache until a package-lock.json,
      # npm-shrinkwrap.json or yarn.lock is committed at the configured path.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime diagnostics
        run: |
          node --version
          npm --version

      - name: Validate course content
        run: npm run validate:content

      - name: Build Docusaurus
        shell: bash
        run: |
          set +e
          set -o pipefail
          npm exec docusaurus build 2>&1 | tee docusaurus-build.log
          build_status=${PIPESTATUS[0]}

          server_bundle=$(find .docusaurus -type f -name 'server.bundle.js' -print -quit 2>/dev/null || true)
          if [[ -n "$server_bundle" ]]; then
            cp "$server_bundle" server.bundle.js
            grep -n -C 2 'resolveWeak' "$server_bundle" > server-bundle-resolveweak-context.txt || true
          fi

          exit "$build_status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build-diagnostics-${{ github.run_id }}
          path: |
            docusaurus-build.log
            server.bundle.js
            server-bundle-resolveweak-context.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
