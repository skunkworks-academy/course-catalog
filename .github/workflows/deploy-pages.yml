name: Validate course catalogue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-catalog-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Runtime diagnostics
        run: |
          node --version
          npm --version

      - name: Validate course content
        run: npm run validate:content

      - name: Build Docusaurus for Academy origin
        run: npm exec docusaurus build

      - name: Verify canonical /courses output
        run: |
          test -f build/courses.html || test -f build/courses/index.html
          grep -R -q 'https://www.skunkworksacademy.com/courses' build/courses.html build/courses/index.html 2>/dev/null
          grep -R -q 'academy-navigation.js?v=2026.08.15.1' build/courses.html build/courses/index.html 2>/dev/null
          if grep -R -q 'catalog.skunkworksacademy.com' build --include='*.html' --include='*.xml'; then
            echo 'Legacy catalog.skunkworksacademy.com references remain in build output.'
            exit 1
          fi

      - name: Upload build artifact for www deployment diagnostics
        if: always() && hashFiles('build/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: course-catalog-build-${{ github.run_id }}
          path: build
          if-no-files-found: error
          retention-days: 7

      - name: Explain missing build artifact
        if: always() && hashFiles('build/**') == ''
        run: echo 'No build artifact exists because an earlier validation or build step did not produce build output; artifact upload was skipped.'

      - name: Deployment ownership note
        run: |
          echo 'Canonical production hosting is owned by skunkworks-academy/www.'
          echo 'The www release workflow publishes this build under https://www.skunkworksacademy.com/courses.'
